<svg xmlns="http://www.w3.org/2000/svg" width="960" height="384" viewBox="0 0 960 384" role="img" aria-label="Step 1: you ask your agent to publish a page. Step 2: it gives you a private link on your domain. Step 3: someone on your list signs in with an email code and sees the page; anyone else is blocked.">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141922"/><stop offset="1" stop-color="#0b0f14"/></linearGradient>
    <filter id="raise" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".45"/></filter>
    <clipPath id="ask"><rect x="80" y="212" width="190" height="30"><animate attributeName="width" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.0500;0.1667;0.9500;0.9833;1.0000" values="0;0;190;190;0;0"/></rect></clipPath>
    <clipPath id="email"><rect x="712" y="198" width="160" height="24"><animate attributeName="width" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.4583;0.5500;0.9500;0.9833;1.0000" values="0;0;160;160;0;0"/></rect></clipPath>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="958" height="382" rx="20" fill="url(#stage)" stroke="#262c36"/>
  
  <circle cx="43" cy="44" r="13" fill="#F26A1F"/>
  <text x="43" y="49" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="66" y="50" font-size="17" font-weight="700" fill="#f0f3f6">Ask your agent</text>
  
  <circle cx="358" cy="44" r="13" fill="#F26A1F"/>
  <text x="358" y="49" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="381" y="50" font-size="17" font-weight="700" fill="#f0f3f6">Get a private link</text>
  
  <circle cx="673" cy="44" r="13" fill="#F26A1F"/>
  <text x="673" y="49" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
  <text x="696" y="50" font-size="17" font-weight="700" fill="#f0f3f6">Only your list gets in</text>

  <!-- 1: you ask -->
  
  <rect x="30" y="74" width="270" height="262" rx="12" fill="#161b22" stroke="#30363d"/>
  <path d="M42 74h246a12 12 0 0 1 12 12v18H30V86a12 12 0 0 1 12-12z" fill="#1c2129"/>
  <circle cx="48" cy="89" r="5" fill="#ff5f57"/><circle cx="64" cy="89" r="5" fill="#febc2e"/><circle cx="80" cy="89" r="5" fill="#28c840"/>
  <text x="286" y="93" text-anchor="end" font-size="11.5" fill="#8b949e">Claude Code · Codex</text>
  <rect x="48" y="122" width="234" height="60" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path transform="translate(60 138) scale(0.10938)" fill="#F26A1F" d="M44,128H212a4,4,0,0,0,4-4V88a8,8,0,0,0-2.34-5.66l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40v84A4,4,0,0,0,44,128ZM152,44l44,44H152ZM68,160v48a8,8,0,0,1-16,0V192H32v16a8,8,0,0,1-16,0V160a8,8,0,0,1,16,0v16H52V160a8,8,0,0,1,16,0Zm56,0a8,8,0,0,1-8,8h-8v40a8,8,0,0,1-16,0V168H84a8,8,0,0,1,0-16h32A8,8,0,0,1,124,160Zm72,0v48a8,8,0,0,1-16,0V184l-9.6,12.8a8,8,0,0,1-12.8,0L148,184v24a8,8,0,0,1-16,0V160a8,8,0,0,1,14.4-4.8L164,178.67l17.6-23.47A8,8,0,0,1,196,160Zm56,48a8,8,0,0,1-8,8H216a8,8,0,0,1-8-8V160a8,8,0,0,1,16,0v40h20A8,8,0,0,1,252,208Z"/>
  <text x="98" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" fill="#e6edf3">index.html</text>
  <text x="98" y="168" font-size="13" fill="#8b949e">your Q3 finance dashboard</text>
  <rect x="66" y="206" width="216" height="42" rx="14" fill="#F26A1F"/>
  <text x="80" y="232" font-size="15" font-weight="600" fill="#fff" clip-path="url(#ask)">Publish this as finance</text>
  <g opacity="1"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.1750;0.2000;0.9500;0.9833;1.0000" values="0;0;1;1;0;0"/>
    <circle cx="54" cy="288" r="3.5" fill="#8b949e"/>
    <text x="66" y="292" font-size="13" fill="#8b949e">Checks the page, then uploads it</text>
  </g>
  
  <g opacity="1"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.2167;0.2417;0.9500;0.9833;1.0000" values="0;0;1;1;0;0"/>
    <path d="M306 224h24M324 218.5l6 5.5-6 5.5" fill="none" stroke="#F26A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 2: you get a link -->
  
  <rect x="345" y="74" width="270" height="262" rx="12" fill="#161b22" stroke="#30363d"/>
  <path d="M357 74h246a12 12 0 0 1 12 12v18H345V86a12 12 0 0 1 12-12z" fill="#1c2129"/>
  <circle cx="363" cy="89" r="5" fill="#ff5f57"/><circle cx="379" cy="89" r="5" fill="#febc2e"/><circle cx="395" cy="89" r="5" fill="#28c840"/>
  <text x="601" y="93" text-anchor="end" font-size="11.5" fill="#8b949e">Claude Code · Codex</text>
  <g opacity="1"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.2500;0.2750;0.9500;0.9833;1.0000" values="0;0;1;1;0;0"/>
    <path transform="translate(357 143) scale(0.09375)" fill="#3fb950" d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm45.66,85.66-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35a8,8,0,0,1,11.32,11.32Z"/>
