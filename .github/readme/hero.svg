    <text x="389" y="172" font-size="13.5" fill="#8b949e">3 files, live on your domain.</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.2833;0.3083;0.9500;0.9833;1.0000" values="0;0;1;1;0;0"/>
    <rect x="361" y="202" width="238" height="40" rx="20" fill="#0d1117" stroke="#388bfd" stroke-opacity=".55"/>
    <path transform="translate(373 214) scale(0.06250)" fill="#F26A1F" d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96Z"/>
    <text x="395" y="227" font-size="13" fill="#58a6ff">static.yourdomain.com/finance</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.3167;0.3417;0.9500;0.9833;1.0000" values="0;0;1;1;0;0"/>
    <text x="363" y="274" font-size="13" fill="#8b949e">Paste it in Slack, email, anywhere.</text>
  </g>
  
  <g opacity="1"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.3667;0.3917;0.9500;0.9833;1.0000" values="0;0;1;1;0;0"/>
    <path d="M621 224h24M639 218.5l6 5.5-6 5.5" fill="none" stroke="#F26A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 3: only your list gets in -->
  <rect x="660" y="74" width="270" height="262" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M672 74h246a12 12 0 0 1 12 12v22H660V86a12 12 0 0 1 12-12z" fill="#f6f8fa"/>
  <circle cx="676" cy="91" r="4" fill="#d0d7de"/><circle cx="690" cy="91" r="4" fill="#d0d7de"/><circle cx="704" cy="91" r="4" fill="#d0d7de"/>
  <rect x="716" y="81" width="202" height="20" rx="10" fill="#fff" stroke="#d0d7de"/>
  <path transform="translate(724 85.5) scale(0.04297)" fill="#57606a" d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96Z"/>
  <text x="739" y="95" font-size="10.5" fill="#57606a">static.yourdomain.com/finance</text>

  <g opacity="0"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.4167;0.4417;0.6167;0.6417;1.0000" values="0;0;1;1;0;0"/>
    <text x="795" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">yourdomain.com</text>
    <text x="795" y="172" text-anchor="middle" font-size="12.5" fill="#57606a">Get a login code emailed to you</text>
    <rect x="700" y="192" width="190" height="32" rx="7" fill="#fff" stroke="#d0d7de"/>
    <text x="712" y="213" font-size="13" fill="#1f2328" clip-path="url(#email)">sam@yourco.com</text>
    <rect x="700" y="232" width="190" height="32" rx="7" fill="#F26A1F"/>
    <text x="795" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Send me a code</text>
  </g>

  <g opacity="1"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.6333;0.6667;0.9500;0.9833;1.0000" values="0;0;1;1;0;0"/>
    <text x="676" y="140" font-size="16" font-weight="700" fill="#1f2328">Q3 finance</text>
    <text x="676" y="158" font-size="11.5" fill="#656d76">Revenue by month</text>
    <rect x="682" y="254" width="24" height="44" rx="4" fill="#F7A350"/><rect x="720" y="238" width="24" height="60" rx="4" fill="#F59A49"/><rect x="758" y="245" width="24" height="53" rx="4" fill="#F39042"/><rect x="796" y="222" width="24" height="76" rx="4" fill="#F1853A"/><rect x="834" y="208" width="24" height="90" rx="4" fill="#F07A31"/><rect x="872" y="186" width="24" height="112" rx="4" fill="#EE6A24"/>
    <path d="M676 298.5h238" stroke="#d0d7de"/>
  </g>

  <!-- someone not on the list: one line from the sign-in log, pinned on the window's edge -->
  <g opacity="1"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.7167;0.7500;0.9500;0.9833;1.0000" values="0;0;1;1;0;0"/>
    <g><animateTransform attributeName="transform" type="translate" dur="12.0s" repeatCount="indefinite" keyTimes="0.0000;0.7167;0.7500;0.9500;0.9833;1.0000" values="0 6;0 6;0 0;0 0;0 6;0 6"/>
      <rect x="710" y="318" width="208" height="36" rx="10" fill="#ffffff" stroke="#d0d7de" filter="url(#raise)"/>
      <circle cx="733" cy="336" r="10" fill="#0969da"/>
      <text x="733" y="340.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">A</text>
      <text x="751" y="340.5" font-size="12.5" fill="#1f2328">alex@gmail.com</text>
      <text x="906" y="340.5" text-anchor="end" font-size="12.5" font-weight="600" fill="#cf222e">Blocked</text>
    </g>
  </g>
  </g>
